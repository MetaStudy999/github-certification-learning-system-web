name: GCLS Web P8 Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [p8-rag-grounding]

permissions:
  contents: read

jobs:
  p8-verify:
    runs-on: ubuntu-24.04
    env:
      AI_MODE: mock
      RAG_EMBEDDING_MODE: mock
      RAG_EMBEDDING_DIMENSIONS: '384'
      RAG_GROUNDING_MODE: required
      RAG_TOP_K: '5'
      RAG_MIN_SIMILARITY: '-1'
      RAG_INDEX_TOKEN: p8-ci-token
      GCLS_CONTENT_PROVIDER: local
      GCLS_CONTENT_DIR: ${{ github.workspace }}/.gcls-content
      GCLS_CONTENT_REPOSITORY: MetaStudy999/github-certification-learning-system
      GCLS_CONTENT_REF: main

    steps:
      - name: Checkout web repository
        uses: actions/checkout@v6

      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          repository: MetaStudy999/github-certification-learning-system
          ref: main
          path: .gcls-content

      - name: Pin content version
        shell: bash
        run: echo "GCLS_CONTENT_VERSION=$(git -C .gcls-content rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Start Supabase and apply P8 migrations
        shell: bash
        run: |
          sed -i 's/port = 54321/port = 58321/' supabase/config.toml
          sed -i 's/port = 54322/port = 58322/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 58320/' supabase/config.toml
          sed -i 's/port = 54324/port = 58324/' supabase/config.toml

          npx --yes supabase@2.115.0 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit > /tmp/p8-supabase-start.log 2>&1
          npx --yes supabase@2.115.0 db reset > /tmp/p8-supabase-reset.log 2>&1
          npx --yes supabase@2.115.0 status -o env > /tmp/supabase-p8.env
          set -a
          source /tmp/supabase-p8.env
          set +a
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          test -n "$SECRET_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$SECRET_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:58321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "P8_SUPABASE_URL=http://127.0.0.1:58321" >> "$GITHUB_ENV"
          echo "P8_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Start P8 mock application
        shell: bash
        run: |
          npm run start > /tmp/gcls-p8.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          curl -fsS http://127.0.0.1:3000/api/rag/health | grep '"status":"empty"'

      - name: RAG index, safe retrieval, tutor grounding and audit
        shell: bash
        run: |
          EMAIL1="p8-ci-$(date +%s)-1@example.com"
          EMAIL2="p8-ci-$(date +%s)-2@example.com"
          PASSWORD='P8-test-123!'

          SIGNUP1=$(curl -fsS "$P8_SUPABASE_URL/auth/v1/signup" -H "apikey: $P8_ANON_KEY" -H 'content-type: application/json' -d "{\"email\":\"$EMAIL1\",\"password\":\"$PASSWORD\"}")
          ACCESS1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          USER1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.user?.id||"")')
          test -n "$ACCESS1"
          test -n "$USER1"

          BEFORE=$(curl -sS -o /tmp/p8-before.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/ai/tutor \
            -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' \
            -d '{"courseSlug":"001-foundations","setSlug":"010-basics","questionId":"Q001","stage":"HINT"}')
          test "$BEFORE" = '503'
          grep 'RAG_NOT_READY' /tmp/p8-before.json

          UNAUTH=$(curl -sS -o /tmp/p8-index-unauth.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/rag/index -H 'content-type: application/json' -d '{}')
          test "$UNAUTH" = '401'

          INDEX=$(curl -fsS -X POST http://127.0.0.1:3000/api/rag/index \
            -H 'x-rag-index-token: p8-ci-token' -H 'content-type: application/json' \
            -d '{"courseSlug":"001-foundations"}')
          printf '%s' "$INDEX" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(x.targetDocuments!==10||x.indexedDocuments!==10||x.documentCount!==10||x.chunkCount<10)throw new Error(JSON.stringify(x));'

          REINDEX=$(curl -fsS -X POST http://127.0.0.1:3000/api/rag/index -H 'x-rag-index-token: p8-ci-token' -H 'content-type: application/json' -d '{}')
          printf '%s' "$REINDEX" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(x.indexedDocuments!==0||x.skippedDocuments!==10)throw new Error(JSON.stringify(x));'

          HEALTH=$(curl -fsS http://127.0.0.1:3000/api/rag/health)
          printf '%s' "$HEALTH" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(x.status!=="ready"||x.documentCount!==10||x.chunkCount<10)throw new Error(JSON.stringify(x));'

          SEARCH=$(curl -fsS -X POST http://127.0.0.1:3000/api/rag/search \
            -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' \
            -d '{"courseSlug":"001-foundations","query":"Git과 GitHub의 관계","limit":5}')
          printf '%s' "$SEARCH" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(!x.sources?.length)throw new Error("no sources");if(x.sources.some(s=>s.sourceTier!=="PRE_ANSWER"||/080-question-bank|110-mock-exams|120-wrong-answers/.test(s.sourcePath)))throw new Error(JSON.stringify(x.sources));'

          HINT=$(curl -fsS -X POST http://127.0.0.1:3000/api/ai/tutor \
            -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' \
            -d '{"courseSlug":"001-foundations","setSlug":"010-basics","questionId":"Q001","stage":"HINT"}')
          printf '%s' "$HINT" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(!x.grounded||x.groundingMode!=="required"||!x.sources?.length||x.answerRevealAllowed!==false)throw new Error(JSON.stringify(x));if(x.sources.some(s=>s.sourceTier!=="PRE_ANSWER"))throw new Error("unsafe pre-answer source");'

          EXPLAIN_BEFORE=$(curl -sS -o /tmp/p8-explain-before.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/ai/tutor \
            -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' \
            -d '{"courseSlug":"001-foundations","setSlug":"010-basics","questionId":"Q001","stage":"EXPLANATION"}')
          test "$EXPLAIN_BEFORE" = '409'

          ATTEMPT=$(curl -fsS -X POST http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q001/submit \
            -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' -d '{"selectedAnswer":"A"}')
          echo "$ATTEMPT" | grep 'attemptId'

          EXPLANATION=$(curl -fsS -X POST http://127.0.0.1:3000/api/ai/tutor \
            -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' \
            -d '{"courseSlug":"001-foundations","setSlug":"010-basics","questionId":"Q001","stage":"EXPLANATION"}')
          printf '%s' "$EXPLANATION" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(!x.grounded||!x.sources?.length||x.answerRevealAllowed!==true)throw new Error(JSON.stringify(x));if(x.sources.some(s=>/080-question-bank|110-mock-exams|120-wrong-answers/.test(s.sourcePath)))throw new Error("excluded source leaked");'

          INTERACTIONS=$(curl -fsS "$P8_SUPABASE_URL/rest/v1/ai_interactions?select=id,stage,rag_grounded,rag_source_count&order=created_at.asc" -H "apikey: $P8_ANON_KEY" -H "Authorization: Bearer $ACCESS1")
          printf '%s' "$INTERACTIONS" | node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(0,"utf8"));if(rows.length<2||rows.some(r=>!r.rag_grounded||r.rag_source_count<1))throw new Error(JSON.stringify(rows));'

          SOURCES=$(curl -fsS "$P8_SUPABASE_URL/rest/v1/ai_interaction_sources?select=id,source_path,similarity" -H "apikey: $P8_ANON_KEY" -H "Authorization: Bearer $ACCESS1")
          printf '%s' "$SOURCES" | node -e 'const fs=require("fs");const rows=JSON.parse(fs.readFileSync(0,"utf8"));if(!rows.length)throw new Error("missing source audit");'

          DIRECT=$(curl -sS -o /tmp/p8-direct.json -w '%{http_code}' "$P8_SUPABASE_URL/rest/v1/rag_documents?select=id" -H "apikey: $P8_ANON_KEY" -H "Authorization: Bearer $ACCESS1")
          test "$DIRECT" -ge 400

          SIGNUP2=$(curl -fsS "$P8_SUPABASE_URL/auth/v1/signup" -H "apikey: $P8_ANON_KEY" -H 'content-type: application/json' -d "{\"email\":\"$EMAIL2\",\"password\":\"$PASSWORD\"}")
          ACCESS2=$(printf '%s' "$SIGNUP2" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          test -n "$ACCESS2"
          ISOLATED=$(curl -fsS "$P8_SUPABASE_URL/rest/v1/ai_interaction_sources?select=id" -H "apikey: $P8_ANON_KEY" -H "Authorization: Bearer $ACCESS2")
          test "$ISOLATED" = '[]'

          printf '\nP8 drift probe\n' >> .gcls-content/001-foundations/020-terms/README.md
          DRIFT=$(curl -fsS -X POST http://127.0.0.1:3000/api/rag/index -H 'x-rag-index-token: p8-ci-token' -H 'content-type: application/json' -d '{}')
          printf '%s' "$DRIFT" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(x.indexedDocuments!==1||x.skippedDocuments!==9)throw new Error(JSON.stringify(x));'

          echo "ACCESS1=$ACCESS1" >> "$GITHUB_ENV"

      - name: Stop mock application
        if: always()
        shell: bash
        run: |
          if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true; fi

      - name: Start fake embedding providers
        shell: bash
        run: |
          FAKE_AI_PORT=18181 node scripts/fake-ai-provider.mjs > /tmp/p8-fake-ai.log 2>&1 &
          echo "FAKE_AI_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18181/api/tags >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:18181/api/tags >/dev/null

      - name: Ollama and OpenAI embedding contracts plus profile mismatch gate
        shell: bash
        run: |
          run_app() {
            PORT="$1"; shift
            env "$@" npm run start -- -p "$PORT" > "/tmp/gcls-p8-$PORT.log" 2>&1 &
            CURRENT_PID=$!
            for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null
          }
          stop_app() { kill "$1" 2>/dev/null || true; wait "$1" 2>/dev/null || true; }

          run_app 3015 RAG_EMBEDDING_MODE=local OLLAMA_BASE_URL=http://127.0.0.1:18181 OLLAMA_EMBEDDING_MODEL=fake-embed RAG_GROUNDING_MODE=required RAG_MIN_SIMILARITY=-1 RAG_INDEX_TOKEN=p8-ci-token
          LOCAL_PID=$CURRENT_PID
          LOCAL_INDEX=$(curl -fsS -X POST http://127.0.0.1:3015/api/rag/index -H 'x-rag-index-token: p8-ci-token' -H 'content-type: application/json' -d '{}')
          printf '%s' "$LOCAL_INDEX" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(x.indexedDocuments!==10||!x.embeddingProfile.startsWith("ollama-embedding:"))throw new Error(JSON.stringify(x));'
          LOCAL_SEARCH=$(curl -fsS -X POST http://127.0.0.1:3015/api/rag/search -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' -d '{"query":"Git Repository"}')
          echo "$LOCAL_SEARCH" | grep '"embeddingProvider":"ollama-embedding"'
          stop_app "$LOCAL_PID"

          run_app 3016 RAG_EMBEDDING_MODE=api OPENAI_BASE_URL=http://127.0.0.1:18181/v1 OPENAI_API_KEY=test-openai-key OPENAI_EMBEDDING_MODEL=fake-openai-embed RAG_GROUNDING_MODE=required RAG_MIN_SIMILARITY=-1 RAG_INDEX_TOKEN=p8-ci-token
          API_PID=$CURRENT_PID
          API_INDEX=$(curl -fsS -X POST http://127.0.0.1:3016/api/rag/index -H 'x-rag-index-token: p8-ci-token' -H 'content-type: application/json' -d '{}')
          printf '%s' "$API_INDEX" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(x.indexedDocuments!==10||!x.embeddingProfile.startsWith("openai-embedding:"))throw new Error(JSON.stringify(x));'
          API_SEARCH=$(curl -fsS -X POST http://127.0.0.1:3016/api/rag/search -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' -d '{"query":"Git Repository"}')
          echo "$API_SEARCH" | grep '"embeddingProvider":"openai-embedding"'
          stop_app "$API_PID"

          run_app 3017 RAG_EMBEDDING_MODE=local OLLAMA_BASE_URL=http://127.0.0.1:18181 OLLAMA_EMBEDDING_MODEL=fake-embed RAG_GROUNDING_MODE=required RAG_MIN_SIMILARITY=-1 RAG_INDEX_TOKEN=p8-ci-token
          MISMATCH_PID=$CURRENT_PID
          MISMATCH_STATUS=$(curl -sS -o /tmp/p8-profile-mismatch.json -w '%{http_code}' -X POST http://127.0.0.1:3017/api/rag/search -H "Authorization: Bearer $ACCESS1" -H 'content-type: application/json' -d '{"query":"Git Repository"}')
          test "$MISMATCH_STATUS" = '503'
          grep 'RAG_PROFILE_MISMATCH' /tmp/p8-profile-mismatch.json
          stop_app "$MISMATCH_PID"

      - name: Stop fake AI and Supabase
        if: always()
        shell: bash
        run: |
          if [ -n "${FAKE_AI_PID:-}" ]; then kill "$FAKE_AI_PID" 2>/dev/null || true; fi
          npx --yes supabase@2.115.0 stop || true
