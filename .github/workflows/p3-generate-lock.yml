name: P3 Generate Lockfile

on:
  push:
    branches: [p3-user-progress]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: p3-user-progress
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate and commit lockfile
        shell: bash
        run: |
          test -f package-lock.json
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "build: update P3 npm lockfile"
          git push origin HEAD:p3-user-progress
