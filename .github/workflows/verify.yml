name: GCLS Web Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "p*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      AI_MODE: mock
      GCLS_CONTENT_PROVIDER: local
      GCLS_CONTENT_DIR: ${{ github.workspace }}/.gcls-content
      GCLS_CONTENT_REPOSITORY: MetaStudy999/github-certification-learning-system
      GCLS_CONTENT_REF: main
    steps:
      - name: Checkout web repository
        uses: actions/checkout@v6

      - name: Checkout content repository
        uses: actions/checkout@v6
        with:
          repository: MetaStudy999/github-certification-learning-system
          ref: main
          path: .gcls-content

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static verification
        run: npm run verify

      - name: Type check
        run: npm run typecheck

      - name: Start Supabase and apply migrations
        shell: bash
        run: |
          # Keep repository defaults for local developers and isolate CI-only ports.
          sed -i 's/port = 54321/port = 55321/' supabase/config.toml
          sed -i 's/port = 54322/port = 55322/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 55320/' supabase/config.toml
          sed -i 's/port = 54324/port = 55324/' supabase/config.toml

          npx --yes supabase@2.115.0 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
          npx --yes supabase@2.115.0 db reset
          npx --yes supabase@2.115.0 status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          test -n "$SECRET_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:55321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "P3_SUPABASE_URL=http://127.0.0.1:55321" >> "$GITHUB_ENV"
          echo "P3_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Next.js Content Progress Question and Wrong Answer runtime smoke test
        shell: bash
        run: |
          npm run start > /tmp/gcls-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/content/health | tee /tmp/content-health.json
          grep '"status":"ok"' /tmp/content-health.json
          grep '"provider":"local"' /tmp/content-health.json
          grep '"moduleCount":15' /tmp/content-health.json

          curl -fsS http://127.0.0.1:3000/api/questions/health | tee /tmp/question-health.json
          grep '"status":"ok"' /tmp/question-health.json
          grep '"provider":"local"' /tmp/question-health.json
          grep '"setCount":10' /tmp/question-health.json
          grep '"questionCount":100' /tmp/question-health.json

          curl -fsS http://127.0.0.1:3000/courses/001-foundations | grep 'GitHub Foundations'
          curl -fsS http://127.0.0.1:3000/courses/001-foundations/010-overview | grep 'GH-900'
          curl -fsS http://127.0.0.1:3000/questions/001-foundations | grep 'GH-900 100문제'
          curl -fsS http://127.0.0.1:3000/questions/001-foundations/010-basics > /tmp/qset.html
          grep 'Q001' /tmp/qset.html
          grep 'Q010' /tmp/qset.html
          if grep -q '정답: B' /tmp/qset.html; then
            echo 'Correct answer leaked in initial question HTML.' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/wrong-answers | grep 'GH-900 오답 재학습 Queue'
          curl -fsS http://127.0.0.1:3000/login | grep '학습자 계정'
          curl -fsS http://127.0.0.1:3000/progress | grep '내 학습 진행률'
          curl -fsS http://127.0.0.1:3000/api/ai/health
          VERIFY_RUNNING=1 npm run verify

      - name: P3 Auth Progress and RLS smoke test
        shell: bash
        run: |
          EMAIL1="p3-ci-$(date +%s)-1@example.com"
          EMAIL2="p3-ci-$(date +%s)-2@example.com"
          PASSWORD='P3-test-123!'

          SIGNUP1=$(curl -fsS "$P3_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $P3_ANON_KEY" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL1\",\"password\":\"$PASSWORD\",\"data\":{\"display_name\":\"P3 Learner One\"}}")
          ACCESS1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          USER1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.user?.id||"")')
          test -n "$ACCESS1"
          test -n "$USER1"

          PROFILE1=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/learner_profiles?select=id,display_name&id=eq.$USER1" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1")
          echo "$PROFILE1" | grep 'P3 Learner One'

          VISIT=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/rpc/record_module_visit" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"p_course_slug":"001-foundations","p_module_slug":"010-overview","p_total_modules":15}')
          echo "$VISIT" | grep '"status": "in_progress"\|"status":"in_progress"'

          COMPLETE=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/rpc/set_module_completion" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"p_course_slug":"001-foundations","p_module_slug":"010-overview","p_completed":true,"p_total_modules":15}')
          echo "$COMPLETE" | grep '"completed_modules": 1\|"completed_modules":1'

          COURSE=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/course_progress?select=course_slug,status,total_modules,completed_modules&course_slug=eq.001-foundations" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1")
          echo "$COURSE" | grep '"completed_modules":1'
          echo "$COURSE" | grep '"total_modules":15'

          START=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/rpc/start_study_session" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"p_course_slug":"001-foundations","p_module_slug":"010-overview"}')
          SESSION_ID=$(printf '%s' "$START" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(typeof x==="string"?x:"")')
          test -n "$SESSION_ID"
          curl -fsS "$P3_SUPABASE_URL/rest/v1/rpc/finish_study_session" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d "{\"p_session_id\":\"$SESSION_ID\"}" >/tmp/session-finish.json

          SIGNUP2=$(curl -fsS "$P3_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $P3_ANON_KEY" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL2\",\"password\":\"$PASSWORD\",\"data\":{\"display_name\":\"P3 Learner Two\"}}")
          ACCESS2=$(printf '%s' "$SIGNUP2" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          test -n "$ACCESS2"
          ISOLATED=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/learner_profiles?select=id&id=eq.$USER1" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS2")
          test "$ISOLATED" = '[]'

      - name: P4 Question evaluation Attempt and RLS smoke test
        shell: bash
        run: |
          npm run start > /tmp/gcls-p4.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/questions/health >/dev/null && break
            sleep 1
          done

          EMAIL1="p4-ci-$(date +%s)-1@example.com"
          EMAIL2="p4-ci-$(date +%s)-2@example.com"
          PASSWORD='P4-test-123!'

          SIGNUP1=$(curl -fsS "$P3_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $P3_ANON_KEY" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL1\",\"password\":\"$PASSWORD\"}")
          ACCESS1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          USER1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.user?.id||"")')
          test -n "$ACCESS1"
          test -n "$USER1"

          CORRECT_STATUS=$(curl -sS -o /tmp/p4-correct.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q001/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"selectedAnswer":"B"}')
          cat /tmp/p4-correct.json
          if [ "$CORRECT_STATUS" != '200' ]; then
            cat /tmp/gcls-p4.log
            exit 1
          fi
          CORRECT=$(cat /tmp/p4-correct.json)
          echo "$CORRECT" | grep '"isCorrect":true'
          echo "$CORRECT" | grep '"correctAnswer":"B"'

          INCORRECT_STATUS=$(curl -sS -o /tmp/p4-incorrect.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q002/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"selectedAnswer":"B"}')
          cat /tmp/p4-incorrect.json
          test "$INCORRECT_STATUS" = '200'
          INCORRECT=$(cat /tmp/p4-incorrect.json)
          echo "$INCORRECT" | grep '"isCorrect":false'
          echo "$INCORRECT" | grep '"correctAnswer":"A"'

          ATTEMPTS=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/question_attempts?select=question_id,selected_answer,correct_answer,is_correct&order=attempted_at.asc" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1")
          echo "$ATTEMPTS" | grep '"question_id":"Q001"'
          echo "$ATTEMPTS" | grep '"question_id":"Q002"'

          DIRECT_STATUS=$(curl -sS -o /tmp/direct-insert.json -w '%{http_code}' \
            -X POST "$P3_SUPABASE_URL/rest/v1/question_attempts" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d "{\"user_id\":\"$USER1\",\"course_slug\":\"001-foundations\",\"set_slug\":\"010-basics\",\"question_id\":\"Q999\",\"selected_answer\":\"A\",\"correct_answer\":\"A\",\"is_correct\":true}")
          test "$DIRECT_STATUS" -ge 400

          SIGNUP2=$(curl -fsS "$P3_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $P3_ANON_KEY" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL2\",\"password\":\"$PASSWORD\"}")
          ACCESS2=$(printf '%s' "$SIGNUP2" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          test -n "$ACCESS2"
          ISOLATED=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/question_attempts?select=id&user_id=eq.$USER1" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS2")
          test "$ISOLATED" = '[]'

      - name: P5 Wrong Answer Retry Queue and RLS smoke test
        shell: bash
        run: |
          npm run start > /tmp/gcls-p5.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/wrong-answers >/dev/null && break
            sleep 1
          done

          EMAIL1="p5-ci-$(date +%s)-1@example.com"
          EMAIL2="p5-ci-$(date +%s)-2@example.com"
          PASSWORD='P5-test-123!'

          SIGNUP1=$(curl -fsS "$P3_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $P3_ANON_KEY" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL1\",\"password\":\"$PASSWORD\"}")
          ACCESS1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          USER1=$(printf '%s' "$SIGNUP1" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.user?.id||"")')
          test -n "$ACCESS1"
          test -n "$USER1"

          FIRST_STATUS=$(curl -sS -o /tmp/p5-first.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q001/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"selectedAnswer":"A"}')
          cat /tmp/p5-first.json
          if [ "$FIRST_STATUS" != '200' ]; then
            cat /tmp/gcls-p5.log
            exit 1
          fi
          grep '"isCorrect":false' /tmp/p5-first.json
          grep '"priority":"MEDIUM"' /tmp/p5-first.json
          grep '"status":"OPEN"' /tmp/p5-first.json
          grep '"retryStage":"DAY_1"' /tmp/p5-first.json
          WRONG_ID=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/p5-first.json","utf8"));process.stdout.write(x.wrongAnswer?.id||"")')
          test -n "$WRONG_ID"

          QUEUE=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/wrong_answer_items?select=id,question_id,priority,status,retry_stage,wrong_count&question_id=eq.Q001" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1")
          echo "$QUEUE" | grep '"question_id":"Q001"'
          echo "$QUEUE" | grep '"retry_stage":"DAY_1"'

          CLASSIFY_STATUS=$(curl -sS -o /tmp/p5-classify.json -w '%{http_code}' "http://127.0.0.1:3000/api/wrong-answers/$WRONG_ID/classify" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"errorCode":"COMPARE","reflection":"fetch와 pull의 차이를 혼동했다."}')
          cat /tmp/p5-classify.json
          test "$CLASSIFY_STATUS" = '200'
          grep '"errorCode":"COMPARE"' /tmp/p5-classify.json
          grep '"priority":"MEDIUM"' /tmp/p5-classify.json

          DAY1_STATUS=$(curl -sS -o /tmp/p5-day1.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q001/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d "{\"selectedAnswer\":\"B\",\"mode\":\"retry\",\"wrongAnswerId\":\"$WRONG_ID\"}")
          cat /tmp/p5-day1.json
          test "$DAY1_STATUS" = '200'
          grep '"isCorrect":true' /tmp/p5-day1.json
          grep '"status":"OPEN"' /tmp/p5-day1.json
          grep '"retryStage":"DAY_7"' /tmp/p5-day1.json

          DAY7_STATUS=$(curl -sS -o /tmp/p5-day7.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q001/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d "{\"selectedAnswer\":\"B\",\"mode\":\"retry\",\"wrongAnswerId\":\"$WRONG_ID\"}")
          cat /tmp/p5-day7.json
          test "$DAY7_STATUS" = '200'
          grep '"status":"CLOSED"' /tmp/p5-day7.json
          grep '"retryStage":"CLOSED"' /tmp/p5-day7.json

          SECOND_STATUS=$(curl -sS -o /tmp/p5-second.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q002/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d '{"selectedAnswer":"B"}')
          test "$SECOND_STATUS" = '200'
          WRONG_ID2=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/p5-second.json","utf8"));process.stdout.write(x.wrongAnswer?.id||"")')
          test -n "$WRONG_ID2"

          FAIL_RETRY_STATUS=$(curl -sS -o /tmp/p5-fail-retry.json -w '%{http_code}' http://127.0.0.1:3000/api/questions/001-foundations/010-basics/Q002/submit \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d "{\"selectedAnswer\":\"B\",\"mode\":\"retry\",\"wrongAnswerId\":\"$WRONG_ID2\"}")
          cat /tmp/p5-fail-retry.json
          test "$FAIL_RETRY_STATUS" = '200'
          grep '"isCorrect":false' /tmp/p5-fail-retry.json
          grep '"priority":"HIGH"' /tmp/p5-fail-retry.json
          grep '"retryStage":"DAY_1"' /tmp/p5-fail-retry.json
          grep '"wrongCount":2' /tmp/p5-fail-retry.json

          RETRIES=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/wrong_answer_retries?select=retry_stage,is_correct&wrong_answer_id=eq.$WRONG_ID" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1")
          echo "$RETRIES" | grep '"retry_stage":"DAY_1"'
          echo "$RETRIES" | grep '"retry_stage":"DAY_7"'

          DIRECT_STATUS=$(curl -sS -o /tmp/p5-direct.json -w '%{http_code}' \
            -X POST "$P3_SUPABASE_URL/rest/v1/wrong_answer_items" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS1" \
            -H 'content-type: application/json' \
            -d "{\"user_id\":\"$USER1\",\"course_slug\":\"001-foundations\",\"set_slug\":\"010-basics\",\"question_id\":\"Q999\",\"last_selected_answer\":\"A\",\"correct_answer\":\"B\"}")
          test "$DIRECT_STATUS" -ge 400

          SIGNUP2=$(curl -fsS "$P3_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $P3_ANON_KEY" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL2\",\"password\":\"$PASSWORD\"}")
          ACCESS2=$(printf '%s' "$SIGNUP2" | node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(x.access_token||"")')
          test -n "$ACCESS2"
          ISOLATED=$(curl -fsS "$P3_SUPABASE_URL/rest/v1/wrong_answer_items?select=id&id=eq.$WRONG_ID" \
            -H "apikey: $P3_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS2")
          test "$ISOLATED" = '[]'

      - name: GitHub Provider fallback smoke test
        shell: bash
        env:
          GCLS_CONTENT_PROVIDER: github
        run: |
          PORT=3001 npm run start > /tmp/gcls-next-github.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/content/health >/tmp/github-content-health.json && break
            sleep 1
          done
          cat /tmp/github-content-health.json
          grep '"status":"ok"' /tmp/github-content-health.json
          grep '"provider":"github"' /tmp/github-content-health.json
          grep '"moduleCount":15' /tmp/github-content-health.json
          curl -fsS http://127.0.0.1:3001/api/questions/health | tee /tmp/github-question-health.json
          grep '"status":"ok"' /tmp/github-question-health.json
          grep '"provider":"github"' /tmp/github-question-health.json
          grep '"setCount":10' /tmp/github-question-health.json
          grep '"questionCount":100' /tmp/github-question-health.json

      - name: Supabase Local final status
        run: npx --yes supabase@2.115.0 status

      - name: Stop Supabase Local
        if: always()
        run: npx --yes supabase@2.115.0 stop || true
