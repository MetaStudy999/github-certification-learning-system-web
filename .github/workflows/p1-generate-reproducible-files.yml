name: P1 Generate Reproducible Files

on:
  push:
    branches: [p1-local-environment]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: p1-local-environment
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate current Supabase local config
        shell: bash
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@2.115.0 init
          fi

      - name: Validate generated files
        run: |
          test -f package-lock.json
          test -f supabase/config.toml
          git diff --check

      - name: Commit reproducible files
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json supabase/config.toml && \
             git diff --cached --quiet -- package-lock.json supabase/config.toml && \
             [ -z "$(git status --porcelain -- package-lock.json supabase/config.toml)" ]; then
            echo "Reproducible files already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json supabase/config.toml
          git commit -m "build: add P1 lockfile and Supabase local config"
          git push origin HEAD:p1-local-environment
