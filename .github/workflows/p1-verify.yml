name: P1 Local Environment Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [p1-local-environment]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Static verification
        run: npm run verify

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
